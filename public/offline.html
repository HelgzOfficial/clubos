<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ClubOS — Offline</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #141F3D; color: #F5F7FA;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    text-align: center; padding: 24px;
  }
  .card { max-width: 320px; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  p { font-size: 14px; color: #9CA7C0; margin: 0 0 20px; }
  button {
    background: #D4AF37; color: #141F3D; border: none; border-radius: 12px;
    padding: 10px 20px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>You're offline</h1>
    <p>ClubOS needs a connection to load your club's live data. Reconnect and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
